name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.deps }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # "latest" = the newest release of each dependency that supports this Python version
        deps: ["latest"]
        include:
          # "lowest" = every ">=" floor in setup.py's install_requires (Django, the base package);
          # on the oldest Python that python_requires allows
          - python: "3.8"
            deps: "lowest"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: pip install tox
      - name: Pin the lowest versions setup.py allows
        if: matrix.deps == 'lowest'
        # Reads the requirements from the package's own metadata, so the pins follow setup.py.
        # tox passes PIP_* variables on to pip, so the constraints apply inside the tox env.
        run: |
          pip install packaging
          pip install --quiet --dry-run --no-deps --ignore-installed --report "$RUNNER_TEMP/report.json" .
          python - "$RUNNER_TEMP/report.json" > "$RUNNER_TEMP/constraints.txt" <<'PY'
          import json, sys
          from packaging.requirements import Requirement
          (package,) = json.load(open(sys.argv[1]))["install"]
          for line in package["metadata"].get("requires_dist", []):
              requirement = Requirement(line)
              floors = [spec.version for spec in requirement.specifier if spec.operator == ">="]
              if floors and not requirement.marker:  # markers here are extras such as [dev]
                  print(f"{requirement.name}=={floors[0]}")
          PY
          cat "$RUNNER_TEMP/constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/constraints.txt" >> "$GITHUB_ENV"
      - name: Run tests
        # Runs tox with the Python version on PATH
        run: tox -e py

  package:
    # Build the sdist and wheel the same way the release workflow does, and validate the metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
