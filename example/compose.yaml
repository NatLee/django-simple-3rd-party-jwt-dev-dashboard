# Try the dashboard without touching your own project:
#
#   cd example
#   docker compose up --build
#
# Then open http://localhost:8000/api/__hidden_dev_dashboard/ and log in as demo / demo-pass-123.
# The image installs the dashboard from this checkout. To try your own Google or Microsoft app,
# set SOCIAL_GOOGLE_CLIENT_ID, SOCIAL_MICROSOFT_CLIENT_ID and SOCIAL_MICROSOFT_CLIENT_SECRET
# before `docker compose up`; unset ones are left to django-simple-3rd-party-jwt's defaults.
services:
  dashboard:
    build:
      context: ..
      dockerfile: example/Dockerfile
    ports:
      - "127.0.0.1:${DEMO_PORT:-8000}:8000"
    environment:
      DJANGO_SUPERUSER_USERNAME: demo
      DJANGO_SUPERUSER_PASSWORD: demo-pass-123
      DJANGO_SUPERUSER_EMAIL: demo@example.com
      SOCIAL_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID:-}
      SOCIAL_MICROSOFT_CLIENT_ID: ${SOCIAL_MICROSOFT_CLIENT_ID:-}
      SOCIAL_MICROSOFT_CLIENT_SECRET: ${SOCIAL_MICROSOFT_CLIENT_SECRET:-}
