[tox]
envlist = py{38, 39, 310, 311, 312, 313, 314}
minversion = 3.3.0
isolated_build = true

[testenv]
deps =
    check-manifest >= 0.42
    pytest
    pytest-django
commands =
    check-manifest --ignore 'tox.ini,tests/**,.editorconfig,vscode.env,.vscode/**,docs/**'
    pytest tests {posargs}

[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
pythonpath = .
