[tox]
envlist = py{38, 39, 310, 311, 312, 313, 314}
minversion = 3.3.0
isolated_build = true

[testenv]
# "tox -e py-docs" also installs the [docs] extra (drf-yasg); plain "py" runs without it.
# "tox -e py-jwtmain" runs against django-simple-third-party-jwt's unreleased main, pinned to a
# commit. Point it at the PyPI release (or drop it) once that release is out.
extras =
    docs: docs
deps =
    check-manifest >= 0.42
    pytest
    pytest-django
    jwtmain: django-simple-third-party-jwt @ git+https://github.com/NatLee/django-simple-3rd-party-jwt.git@12c46f5ec02cb2f734d2092eedaccf749b3895c0
commands =
    check-manifest --ignore 'tox.ini,tests/**,.editorconfig,vscode.env,.vscode/**,docs/**'
    pytest tests {posargs}

[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
pythonpath = .
